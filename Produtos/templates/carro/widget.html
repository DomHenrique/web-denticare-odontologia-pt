<table class="table table-border text-white">
    <thead>
        <tr>
            <th colspan="3" class="text-center font-bold text-primary">Carrinho de Compras</th>
        </tr>
        <tr>
            <th>Produto</th>
            <th>Qtd.</th>
            <th>Subtotal</th>
        </tr>
    </thead>

    <tbody>
        {% if request.session.carrinho.items %}
            {% for key, value in request.session.carrinho.items %}
                <tr class="text-center border-b border-gray-700">
                    <th>{{value.nome}}</th>
                    <th>{{value.quantidade}}</th>
                    <td>
                        <div class="flex items-center gap-1">
                            <a href="{% url 'carrinho:adicionar' value.produto_id %}" class="bg-primary hover:bg-blue-600 text-white px-2 py-0.5 rounded text-xs">+</a>
                            <a href="{% url 'carrinho:subtrair' value.produto_id %}" class="bg-red-500 hover:bg-red-600 text-white px-2 py-0.5 rounded text-xs">-</a>
                            <span>R$ {{value.preco}}</span>
                        </div>
                    </td>
                </tr>
            {% endfor %}
        {% else %}
            <tr>
                <td colspan="3">
                    <div class="alert alert-danger text-center text-red-400 py-4">
                        Sem produtos selecionados
                    </div>
                </td>
            </tr>
        {% endif %}
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3" class="text-right font-bold pt-4">Total: R$ {{valor_total_carrinho}}</td>
        </tr>
    </tfoot>

</table>
